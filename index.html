<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Farm Order & Inquiry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Poultry Farm Inquiry & Order Form</h2>
    <form action="#" method="POST">
        
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="farmname">Farm / Business Name (Optional)</label>
            <input type="text" id="farmname" name="farmname" placeholder="Enter farm name">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter email address" required>
        </div>

        <div class="form-group">
            <label for="birdtype">Select Poultry/Bird Type</label>
            <select id="birdtype" name="birdtype" required>
                <option value="">-- Choose Type --</option>
                <option value="broiler">Broiler Chicken (Meat)</option>
                <option value="layer">Layer Chicken (Eggs)</option>
                <option value="cockerel">Cockerel</option>
                <option value="turkey">Turkey</option>
                <option value="duck">Duck</option>
                <option value="quail">Quail</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity Required</label>
            <input type="number" id="quantity" name="quantity" min="1" placeholder="Enter number of birds or crates" required>
        </div>

        <div class="form-group">
            <label for="message">Additional Notes / Delivery Address</label>
            <textarea id="message" name="message" placeholder="Provide specific requirements, delivery dates, or location details..."></textarea>
        </div>

        <button type="submit">Submit Inquiry</button>
    </form>
</div>

</body>
</html>
